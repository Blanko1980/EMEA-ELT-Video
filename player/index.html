<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>In Full Confidence</title>
    <link rel="icon" href="./brand/we-logo.svg" />
    <script>
      // Static files (fonts, audio, logo) are served next to index.html, also under a GitHub Pages sub-path.
      window.remotion_staticBase = new URL(".", window.location.href).pathname.replace(/\/$/, "");
    </script>
    <style>
      @font-face { font-family: "Libre Baskerville"; src: url("./fonts/LibreBaskerville-Variable.woff2") format("woff2"); font-weight: 400 700; }
      @font-face { font-family: "Source Sans 3"; src: url("./fonts/SourceSans3-Variable.woff2") format("woff2"); font-weight: 200 900; }
      :root { color-scheme: light; }
      html, body { margin: 0; background: #fff4ed; color: #1e1e1e; font-family: "Source Sans 3", Aptos, sans-serif; }
      main { max-width: 1280px; margin: 0 auto; padding: 32px 16px 48px; }
      header { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; }
      header img { width: 56px; height: 56px; }
      h1 { font-family: "Libre Baskerville", "Times New Roman", serif; font-size: 26px; font-weight: 700; color: #800239; margin: 0; }
      p { color: #616161; margin: 4px 0 0; font-size: 15px; }
      .frame { border-radius: 12px; overflow: hidden; box-shadow: 0 24px 60px rgba(40, 0, 15, 0.45); }
    </style>
  </head>
  <body>
    <main>
      <header>
        <img src="./brand/we-logo.svg" alt="" />
        <div>
          <h1>In Full Confidence</h1>
          <p>A 2:20 film, generated entirely as code.</p>
        </div>
      </header>
      <div class="frame"><div id="root"></div></div>
    </main>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
