<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Last Four Years</title>
<meta name="description" content="A brief history of the AI era. A cinematic opening film for the EMEA ELT 2026.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --plum:#800239; --lplum:#a50451; --white:#fff4ed; --aqua:#167d83; --canary:#f2c75a;
    --ink:#000; --u:1px;
    --serif:'Libre Baskerville','Baskerville','Baskerville Old Face',Georgia,serif;
    --sans:'Inter','Helvetica Neue',Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--ink);overflow:hidden;color:var(--white);
    -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
  body.playing{cursor:none}
  body.playing.hud-on{cursor:default}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}

  /* ---------- film typography ---------- */
  #stage{position:fixed;inset:0;pointer-events:none;overflow:hidden}
  .t{position:absolute;left:50%;top:50%;white-space:nowrap;opacity:0;visibility:hidden;
     transform:translate(-50%,-50%);will-change:opacity,transform,filter;
     text-shadow:0 0 calc(var(--u)*40) rgba(0,0,0,.45)}
  .serif{font-family:var(--serif);font-weight:400}
  .sans{font-family:var(--sans);text-transform:uppercase}
  #nov{font-size:calc(var(--u)*22);font-weight:400;letter-spacing:.48em;padding-left:.48em}
  #novR{color:transparent}
  #novC{display:inline-block;width:max(2px,calc(var(--u)*2.4));height:1.25em;background:var(--white);
        vertical-align:-.28em;margin-left:-.3em;margin-right:.3em}
  .big{font-size:calc(var(--u)*62)}
  .stmt{font-size:calc(var(--u)*56)}
  .year{font-size:calc(var(--u)*19);font-weight:500;color:rgba(255,244,237,.92)}
  .year::before,.year::after{content:"";display:inline-block;width:calc(var(--u)*46);height:max(1px,var(--u));
        background:#3f9a9c;vertical-align:middle}
  .year::before{margin-right:1.1em}
  .year::after{margin-left:.5em}
  .kw{font-size:calc(var(--u)*21);font-weight:400}
  .elt{font-size:calc(var(--u)*82)}
  .tag{font-size:calc(var(--u)*24);font-weight:500}

  /* ---------- overlays ---------- */
  .ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
      text-align:center;transition:opacity 1s ease;z-index:5}
  .ov.hide{opacity:0;pointer-events:none}
  #intro h1{font-family:var(--serif);font-weight:400;margin:0;font-size:calc(var(--u)*66);
      letter-spacing:.06em;padding-left:.06em;line-height:1.1}
  #intro .sub{font-family:var(--serif);font-style:italic;font-size:calc(var(--u)*24);margin:calc(var(--u)*22) 0 0;
      color:rgba(255,244,237,.78);letter-spacing:.02em}
  .ringbtn{all:unset;cursor:pointer;margin-top:calc(var(--u)*64);width:calc(var(--u)*96);height:calc(var(--u)*96);
      min-width:56px;min-height:56px;border-radius:50%;border:1px solid rgba(255,244,237,.55);position:relative;
      display:grid;place-items:center;transition:border-color .4s ease,transform .6s cubic-bezier(.2,.8,.2,1)}
  .ringbtn::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:1px solid rgba(242,199,90,0);
      transition:border-color .4s ease,inset .6s cubic-bezier(.2,.8,.2,1)}
  .ringbtn:hover,.ringbtn:focus-visible{border-color:var(--white);transform:scale(1.04)}
  .ringbtn:hover::after,.ringbtn:focus-visible::after{border-color:rgba(242,199,90,.8);inset:-14px}
  .ringbtn svg{width:30%;height:30%;margin-left:8%}
  .hint{font-family:var(--sans);font-size:max(11px,calc(var(--u)*13));letter-spacing:.32em;text-transform:uppercase;
      color:rgba(255,244,237,.5);margin-top:calc(var(--u)*44)}
  #outro .hint{margin-top:calc(var(--u)*28)}
  #loading{position:fixed;left:50%;bottom:6%;transform:translateX(-50%);font-family:var(--sans);font-size:11px;
      letter-spacing:.3em;text-transform:uppercase;color:rgba(255,244,237,.35);z-index:6;transition:opacity .6s}

  /* ---------- hud ---------- */
  #hud{position:fixed;left:0;right:0;bottom:0;height:56px;z-index:4;opacity:0;transition:opacity .5s ease;
      display:flex;align-items:center;gap:16px;padding:0 24px;background:linear-gradient(transparent,rgba(0,0,0,.55))}
  body.hud-on #hud{opacity:1}
  #bar{flex:1;height:2px;background:rgba(255,244,237,.18);position:relative;cursor:pointer}
  #bar::before{content:"";position:absolute;inset:-10px 0}
  #fill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--canary)}
  #tc{font-family:var(--sans);font-size:11px;letter-spacing:.2em;color:rgba(255,244,237,.6);min-width:92px;text-align:right;
      font-variant-numeric:tabular-nums}
  .hbtn{all:unset;cursor:pointer;font-family:var(--sans);font-size:11px;letter-spacing:.24em;text-transform:uppercase;
      color:rgba(255,244,237,.7)}
  .hbtn:hover,.hbtn:focus-visible{color:var(--white)}
</style>
</head>
<body>
<canvas id="cv" aria-hidden="true"></canvas>

<div id="stage" aria-hidden="true">
  <div class="t sans" id="nov"><span id="novT"></span><span id="novC"></span><span id="novR">NOVEMBER 2022</span></div>
  <div class="t serif big" id="toy">WE THOUGHT IT WAS A TOY.</div>
  <div class="t sans year" id="year"></div>
  <div class="t serif stmt" id="stmt"></div>
  <div class="t sans kw" id="kw"></div>
  <div class="t serif big" id="l1">THE STORY IS JUST BEGINNING.</div>
  <div class="t serif big" id="l2">THE NEXT FOUR YEARS START NOW.</div>
  <div class="t serif elt" id="elt">EMEA ELT 2026</div>
  <div class="t sans tag" id="tag">HUMANIZE COMPLEXITY</div>
</div>

<section id="intro" class="ov" aria-label="Title">
  <h1>THE LAST FOUR YEARS</h1>
  <p class="sub">A brief history of the AI era.</p>
  <button class="ringbtn" id="playBtn" aria-label="Play the film">
    <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 2.5 L17 10 L4 17.5 Z" fill="#fff4ed"/></svg>
  </button>
  <div class="hint">Sound on &nbsp;·&nbsp; F fullscreen &nbsp;·&nbsp; Space pause</div>
</section>

<section id="outro" class="ov hide" aria-label="End">
  <button class="ringbtn" id="replayBtn" aria-label="Play again">
    <svg viewBox="0 0 24 24" aria-hidden="true" style="margin-left:0"><path d="M12 4a8 8 0 1 1-7.4 5" fill="none" stroke="#fff4ed" stroke-width="1.6" stroke-linecap="round"/><path d="M3.2 4.6 L4.8 9.4 L9.4 7.6" fill="none" stroke="#fff4ed" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <div class="hint">Play again</div>
</section>

<div id="hud">
  <button class="hbtn" id="ppBtn">Pause</button>
  <div id="bar"><div id="fill"></div></div>
  <div id="tc">00:00</div>
  <button class="hbtn" id="muteBtn">Sound</button>
  <button class="hbtn" id="fsBtn">Full</button>
</div>
<div id="loading">Preparing</div>

<script>
(() => {
'use strict';

/* =====================================================================
   THE LAST FOUR YEARS — a brief history of the AI era
   Everything on screen is a pure function of film time t (seconds),
   so the film can be paused, scrubbed and rendered frame-exactly.
   ===================================================================== */

// ---------------------------------------------------------------- utils
const TAU = Math.PI * 2, GA = Math.PI * (3 - Math.sqrt(5));
const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const lerp = (a, b, t) => a + (b - a) * t;
const inv = (a, b, x) => clamp((x - a) / (b - a));
const ss = (a, b, x) => { const t = inv(a, b, x); return t * t * (3 - 2 * t); };
const win = (t, a, b, c, d) => ss(a, b, t) * (1 - ss(c, d, t));
const eio = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const eo = t => 1 - Math.pow(1 - t, 3);
const eob = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const frac = x => x - Math.floor(x);
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ---------------------------------------------------------------- palette
const C = {
  plum: [128, 2, 57], lplum: [165, 4, 81], white: [255, 244, 237],
  aqua: [22, 125, 131], canary: [242, 199, 90], dplum: [92, 1, 41]
};
const mixc = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
const AQUA_L = mixc(C.aqua, C.white, .2);    // aqua lifted for hairlines on dark grounds
const LPLUM_L = mixc(C.lplum, C.white, .22); // light plum lifted for hairlines
const rgba = (c, a) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a < 0 ? 0 : a > 1 ? 1 : +a.toFixed(4)})`;
const SERIF = "'Libre Baskerville', Baskerville, 'Baskerville Old Face', Georgia, serif";
const SANS = "Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif";

// ---------------------------------------------------------------- timeline
// S1 0  · S2 9 · S3 17 · S4 27 · S5 37 · S6 47 · (stop 51) · S7 52.5 · S8 61 · end 67.6
const END = 67.6;
const STOP = 51.0;

// global "momentum": everything that spins integrates this speed curve
function speed(t) {
  if (t >= STOP) return 0;
  if (t < 17) return .7;
  if (t < 27) return lerp(.7, 1.0, inv(17, 27, t));
  if (t < 37) return lerp(1.0, 1.25, inv(27, 37, t));
  if (t < 47) return lerp(1.25, 2.6, ss(37, 46.5, t));
  return lerp(2.6, 5.2, Math.pow(inv(47, STOP, t), 1.4));
}
const PH = new Float64Array(7101);
for (let i = 1; i < PH.length; i++) PH[i] = PH[i - 1] + speed((i - .5) / 100) * .01;
function phase(t) { t = clamp(t, 0, 70.99); const x = t * 100, i = x | 0, f = x - i; return PH[i] + (PH[i + 1] - PH[i]) * f; }

// ---------------------------------------------------------------- canvas
const cv = document.getElementById('cv');
let g = cv.getContext('2d', { alpha: false });
let W = 1, H = 1, DPR = 1, SC = 1, HW = 960, HH = 540, dprCap = 2;
function resize() {
  W = innerWidth; H = innerHeight;
  DPR = Math.min(window.devicePixelRatio || 1, dprCap);
  cv.width = Math.max(1, Math.round(W * DPR)); cv.height = Math.max(1, Math.round(H * DPR));
  SC = Math.min(W / 1920, H / 1080);
  HW = W / 2 / SC; HH = H / 2 / SC;
  document.documentElement.style.setProperty('--u', SC + 'px');
  PL = null;
}
const setWorld = () => g.setTransform(DPR * SC, 0, 0, DPR * SC, W * DPR / 2, H * DPR / 2);
const HAS_LS = 'letterSpacing' in CanvasRenderingContext2D.prototype;

function rrP(P, x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  P.moveTo(x + r, y); P.lineTo(x + w - r, y); P.arc(x + w - r, y + r, r, -Math.PI / 2, 0);
  P.lineTo(x + w, y + h - r); P.arc(x + w - r, y + h - r, r, 0, Math.PI / 2);
  P.lineTo(x + r, y + h); P.arc(x + r, y + h - r, r, Math.PI / 2, Math.PI);
  P.lineTo(x, y + r); P.arc(x + r, y + r, r, Math.PI, Math.PI * 1.5); P.closePath();
}
function circ(P, x, y, r) { P.moveTo(x + r, y); P.arc(x, y, r, 0, TAU); }
function spaced(str, x, y, size, track, color, weight = 500, font = SANS) {
  g.font = `${weight} ${size}px ${font}`; g.textBaseline = 'middle'; g.fillStyle = color;
  const sp = size * track;
  if (HAS_LS) { g.letterSpacing = sp + 'px'; g.textAlign = 'center'; g.fillText(str, x + sp / 2, y); g.letterSpacing = '0px'; return; }
  let w = 0; const ws = [];
  for (const ch of str) { const cw = g.measureText(ch).width; ws.push(cw); w += cw + sp; }
  w -= sp; let cx = x - w / 2, i = 0; g.textAlign = 'left';
  for (const ch of str) { g.fillText(ch, cx, y); cx += ws[i++] + sp; }
}

// ---------------------------------------------------------------- neighbours
function nearestPairs(xs, ys, k, cell) {
  const n = xs.length, grid = new Map();
  const key = (cx, cy) => (cx + 40000) * 80000 + (cy + 40000);
  for (let i = 0; i < n; i++) {
    const kk = key(Math.floor(xs[i] / cell), Math.floor(ys[i] / cell));
    let a = grid.get(kk); if (!a) { a = []; grid.set(kk, a); } a.push(i);
  }
  const seen = new Set(), A = [], B = [];
  for (let i = 0; i < n; i++) {
    const cx = Math.floor(xs[i] / cell), cy = Math.floor(ys[i] / cell), cand = [];
    for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) {
      const a = grid.get(key(cx + dx, cy + dy)); if (!a) continue;
      for (const j of a) if (j !== i) { const ex = xs[j] - xs[i], ey = ys[j] - ys[i]; cand.push([ex * ex + ey * ey, j]); }
    }
    cand.sort((p, q) => p[0] - q[0]);
    for (let m = 0; m < Math.min(k, cand.length); m++) {
      const j = cand[m][1], lo = Math.min(i, j), hi = Math.max(i, j), h = lo * n + hi;
      if (!seen.has(h)) { seen.add(h); A.push(lo); B.push(hi); }
    }
  }
  return { a: Int32Array.from(A), b: Int32Array.from(B), n: A.length };
}

// =====================================================================
// PRECOMPUTED WORLDS
// =====================================================================

// --- S2: the interface multiplies (sunflower / phyllotaxis) ----------
const NN = 2400;
const NX = new Float32Array(NN), NY = new Float32Array(NN), NR = new Float32Array(NN), NK = new Uint8Array(NN);
{ const r = rng(3); for (let i = 0; i < NN; i++) { const rad = Math.sqrt(i), a = i * GA; NX[i] = rad * Math.cos(a); NY[i] = rad * Math.sin(a); NR[i] = rad; const u = r(); NK[i] = i < 3 ? 0 : u < .055 ? 1 : u < .06 ? 2 : 0; } }
const NP = nearestPairs(NX, NY, 3, 3.2);
const NPUL = []; { const r = rng(9); for (let p = 0; p < NP.n; p++) if (r() < .16) NPUL.push([p, .35 + r() * .9, r(), r() < .25 ? 1 : 0]); }
const NSX = new Float32Array(NN), NSY = new Float32Array(NN);
const ITEM_H = .62, ITEM_W = ITEM_H * 1.6, ITEM_R = ITEM_H * .2, CIRC_D = .74;
const Z0 = 48 / ITEM_H;                         // first chat window: 77 × 48 units
const ZF = 1180 / Math.sqrt(NN - 1);            // thousands of circles fill the frame
const BETA = Math.log(Z0 / ZF) / Math.log(NN);
const ZHUB = 138 / Math.sqrt(NN - 1);           // the network condensed into a hub

// --- S3 satellites ---------------------------------------------------
const SAT_RX = 560, SAT_RY = 350, SAT_R = 72;
const SATS = ['PRESENTATIONS', 'VIDEO', 'DESIGN', 'CODE', 'SEARCH', 'TRANSLATION']
  .map((name, j) => ({ name, a: (-90 + 60 * j) * Math.PI / 180, t0: [18.0, 19.0, 19.8, 20.5, 21.1, 21.6][j] }));
const SEARCH_DOTS = []; { const s = .13; for (let y = -6; y <= 6; y++) for (let x = -6; x <= 6; x++) { const px = (x + (y & 1) * .5) * s, py = y * s * .866; if (Math.hypot(px, py) < .66) SEARCH_DOTS.push([px, py, Math.atan2(py, px)]); } }

// --- S4 systems ------------------------------------------------------
const SYS_RX = 640, SYS_RY = 380, SYS_R = 118;
const SYS = ['CITIES', 'TRANSPORT', 'MEDICINE', 'EDUCATION', 'FINANCE', 'COMMUNICATION']
  .map((name, j) => ({ name, a: (-90 + 60 * j) * Math.PI / 180 }));
const TRAFFIC = []; { const r = rng(17); for (let i = 0; i < 420; i++) TRAFFIC.push([1 + (r() * 8 | 0), r() * TAU, (.04 + r() * .12) * (r() < .5 ? -1 : 1), r() < .18 ? 1 : 0]); }

// --- S5 the living ecosystem (circle packing of identity rings) ------
const FIELD_R = 1400, FIELD_HOLE = 300;
const FIELD = (() => {
  const r = rng(21), cells = [], cs = 170, grid = new Map(), key = (x, y) => (x + 500) * 1000 + (y + 500);
  const radii = []; for (let i = 0; i < 5200; i++) radii.push(13 + 70 * Math.pow(r(), 2.8));
  radii.sort((a, b) => b - a);
  for (const rad of radii) {
    for (let tries = 0; tries < 26; tries++) {
      const ang = r() * TAU, d = Math.sqrt(r()) * FIELD_R;
      if (d < FIELD_HOLE + rad || d > FIELD_R - rad) continue;
      const x = Math.cos(ang) * d, y = Math.sin(ang) * d, gx = Math.floor(x / cs), gy = Math.floor(y / cs);
      let ok = true;
      outer: for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) {
        const a = grid.get(key(gx + dx, gy + dy)); if (!a) continue;
        for (const c of a) { const q = rad + c.r + 7; if ((c.x - x) ** 2 + (c.y - y) ** 2 < q * q) { ok = false; break outer; } }
      }
      if (!ok) continue;
      const c = { x, y, r: rad, arcs: [] };
      const na = 1 + (rad > 24) + (rad > 44);
      for (let k = 0; k < na; k++) {
        const u = r();
        c.arcs.push({
          rf: .5 + .42 * (k / Math.max(1, na - 1 || 1)) * (na > 1 ? 1 : .8) + r() * .04,
          len: .7 + r() * 3.6, ph: r() * TAU, sp: (.35 + r() * 1.1) * (r() < .5 ? -1 : 1) * (45 / (rad + 25)),
          col: u < .6 ? 0 : u < .84 ? 1 : u < .975 ? 2 : 3
        });
      }
      cells.push(c);
      const kk = key(gx, gy); let a = grid.get(kk); if (!a) { a = []; grid.set(kk, a); } a.push(c);
      break;
    }
  }
  return cells;
})();
const FN = FIELD.length;
const FX = Float32Array.from(FIELD, c => c.x), FY = Float32Array.from(FIELD, c => c.y), FRAD = Float32Array.from(FIELD, c => c.r);
const FP = nearestPairs(FX, FY, 2, 220);
const FAGENTS = []; { const r = rng(33); for (let i = 0; i < 1500; i++) FAGENTS.push([r() * FP.n | 0, (.25 + r() * .6) * (r() < .5 ? -1 : 1), r(), r() < .22 ? 1 : 0]); }
const FSX = new Float32Array(FN), FSY = new Float32Array(FN);

// --- S6 the larger network (a galaxy of ecosystems) ------------------
const NG = 2600, G_OFF = 3, GK = 1900, GNODE = FIELD_R;
const GX = new Float32Array(NG), GY = new Float32Array(NG), GA1 = [];
{ const r = rng(44); for (let i = 0; i < NG; i++) { const k = i + G_OFF, rad = Math.sqrt(k), a = k * GA; GX[i] = rad * Math.cos(a); GY[i] = rad * Math.sin(a); const u = r(); GA1.push([r() * TAU, .8 + r() * 3.2, (.4 + r()) * (r() < .5 ? -1 : 1), u < .7 ? 0 : u < .88 ? 1 : u < .98 ? 2 : 3, r() * TAU, .6 + r() * 2]); } }
const GP = nearestPairs(GX, GY, 3, 3.2);
const GPUL = []; { const r = rng(45); for (let p = 0; p < GP.n; p++) if (r() < .14) GPUL.push([p, .5 + r(), r()]); }
const GSX = new Float32Array(NG), GSY = new Float32Array(NG);
const Z6END = 830 / (GK * Math.sqrt(NG + G_OFF));

// --- ring systems ----------------------------------------------------
const HUB_RINGS = [
  { rf: 1.0, w: 1, full: [C.white, .3] },
  { rf: 1.08, w: 3.2, cap: 'butt', arcs: [[0, 1.6, C.lplum, 1], [2.4, .9, LPLUM_L, .75], [4.2, 1.3, C.lplum, .85]], sp: .25 },
  { rf: 1.16, w: 1.2, arcs: [[1.2, 2.6, C.white, .45], [4.6, .7, AQUA_L, .95]], sp: -.4 },
  { rf: 1.24, w: 1, ticks: 60, tl: 3, major: 5, a: .3, sp: .08 },
];
const ID_RINGS = [
  { rf: 1.06, w: 1, arcs: [[0, .9, C.white, .4], [3.1, 2.0, C.white, .22]], sp: .1 },
  { rf: 1.0, w: 1.2, full: [C.white, .35] },
  { rf: .955, w: 9, cap: 'butt', arcs: [[0, 1.7, C.lplum, 1], [2.2, 1.1, C.plum, 1], [3.9, 1.8, C.lplum, .85]], sp: .16 },
  { rf: .91, w: 2, arcs: [[.8, 2.6, C.white, .75], [4.3, 1.2, AQUA_L, .95]], sp: -.28 },
  { rf: .875, w: 5, cap: 'butt', arcs: [[2.9, .55, C.canary, .95], [4.0, 1.6, C.lplum, .7]], sp: .42 },
  { rf: .84, w: 1, ticks: 96, tl: 4, major: 8, a: .35, sp: -.07 },
];
const S8R = (() => {
  const r = rng(88), out = [];
  for (let k = 0; k < 14; k++) {
    const arcs = [], na = 1 + (r() * 3 | 0);
    for (let i = 0; i < na; i++) {
      const u = r();
      const col = u < .45 ? C.lplum : u < .8 ? C.white : C.dplum;
      const a = col === C.white ? .14 + r() * .26 : col === C.lplum ? .75 + r() * .25 : .7;
      arcs.push([r() * TAU, .5 + r() * 2.8, col, a]);

  else { const t = film.t; if (film.needsRestart) { film.needsRestart = false; await _resume(); startAudioAt(t); } else await _resume(); }
}
function toggleFS() {
  const d = document;
  if (!d.fullscreenElement && !d.webkitFullscreenElement) { const el = d.documentElement; (el.requestFullscreen || el.webkitRequestFullscreen || (() => { })).call(el); }
  else (d.exitFullscreen || d.webkitExitFullscreen).call(d);
}
let hudTimer = 0;
function showHud() { body.classList.add('hud-on'); clearTimeout(hudTimer); hudTimer = setTimeout(() => { if (film.playing) body.classList.remove('hud-on'); }, 2200); }
addEventListener('mousemove', () => { if (film.mode === 'film') showHud(); });
$('playBtn').addEventListener('click', () => { try { if (!document.fullscreenElement && !DEBUG) document.documentElement.requestFullscreen?.().catch(() => { }); } catch (e) { } play(0); });
$('replayBtn').addEventListener('click', () => play(0));
ppBtn.addEventListener('click', toggle);
$('fsBtn').addEventListener('click', toggleFS);
muteBtn.addEventListener('click', () => { AE.muted = !AE.muted; if (AE.out) AE.out.gain.value = AE.muted ? 0 : .9; muteBtn.textContent = AE.muted ? 'Muted' : 'Sound'; });
$('bar').addEventListener('click', e => { const r = e.currentTarget.getBoundingClientRect(); seek(clamp((e.clientX - r.left) / r.width) * END); });
addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); toggle(); }
  else if (e.key === 'f' || e.key === 'F') toggleFS();
  else if (e.key === 'm' || e.key === 'M') muteBtn.click();
  else if (e.key === 'r' || e.key === 'R') play(0);
  else if (e.key === 'ArrowRight' && film.mode === 'film') seek(clock() + 5);
  else if (e.key === 'ArrowLeft' && film.mode === 'film') seek(clock() - 5);
});
addEventListener('resize', resize);

const fmt = s => { s = Math.max(0, s); const m = Math.floor(s / 60), x = s - m * 60; return String(m).padStart(2, '0') + ':' + x.toFixed(DEBUG ? 1 : 0).padStart(DEBUG ? 4 : 2, '0'); };
let lastFrame = performance.now(), slow = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = now - lastFrame; lastFrame = now;
  if (film.mode === 'intro') { renderIntro(now / 1000); return; }
  let t = clock();
  if (t >= END && film.mode === 'film') { film.playing = false; film.mode = 'end'; film.t = END; body.classList.remove('playing'); outro.classList.remove('hide'); }
  render(film.mode === 'end' ? END : t);
  fill.style.width = (clamp(t / END) * 100).toFixed(2) + '%'; tc.textContent = fmt(t) + ' / ' + fmt(END);
  // adaptive resolution for slower machines
  if (film.playing && dt > 34) { if (++slow > 45 && dprCap > 1) { dprCap = 1; resize(); slow = 0; } } else slow = Math.max(0, slow - 1);
}
function renderIntro(time) {
  updateText(-1);
  drawBackground([30, 2, 18], [6, 0, 4]); setWorld();
  drawS8Rings(time * .7, 1e9, .5, 1.28);
  drawFinish(0, 0);
}

// expose a small API for rehearsal and verification
window.FILM = { renderAt: t => { film.mode = 'film'; intro.style.transition = 'none'; intro.classList.add('hide'); film.playing = false; film.t = t; render(t); }, seek, play, pause, audioTest, get time() { return clock(); }, END };

resize();
const fontsReady = Promise.race([
  Promise.all([
    document.fonts ? document.fonts.load(`italic 21px 'Libre Baskerville'`) : 0,
    document.fonts ? document.fonts.load(`400 22px 'Libre Baskerville'`) : 0,
    document.fonts ? document.fonts.load(`500 22px Inter`) : 0,
    document.fonts ? document.fonts.ready : 0,
  ]),
  new Promise(r => setTimeout(r, 2500)),
]);
fontsReady.then(() => {
  PL = null; SPRITES = makeSprites(); $('loading').style.opacity = 0;
  const jump = parseFloat(params.get('t'));
  if (!isNaN(jump)) { intro.classList.add('hide'); film.mode = 'film'; film.t = clamp(jump, 0, END - .05); film.playing = false; ppBtn.textContent = 'Play'; body.classList.add('hud-on'); }
  requestAnimationFrame(frame);
});
})();
